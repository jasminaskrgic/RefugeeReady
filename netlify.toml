[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Always fetch the latest service worker and manifest.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
